name = "jomiguard-bd-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
APP_ENV = "production"
# Replace with the exact deployed Client and Admin origins before production.
CORS_ORIGINS = "http://localhost:5173,http://localhost:5174"
# Set production origins in Cloudflare dashboard or with wrangler vars.
# Set CLOUDINARY_CLOUD_NAME and CLOUDINARY_API_KEY as vars.
# Set CLOUDINARY_API_SECRET and FIREBASE_WEB_API_KEY with `wrangler secret put`.
